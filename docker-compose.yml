services:
  mongo:
    image: mongo:7
    container_name: xtract-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    container_name: xtract-azurite
    command: azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: xtract-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
  mock-downstream-api:
    image: node:22
    container_name: xtract-mock-downstream
    working_dir: /app/apps/mock-downstream-api
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/xtract-downstream
      - NODE_ENV=development
      - DOCLING_MARKDOWN_SERVICE_URL=http://docling-markdown:7072/api/extract-markdown
    command: npm run dev
    depends_on:
      - mongo
      - docling-markdown

  docling-markdown:
    build:
      context: .
      dockerfile: functions/docling-markdown/Dockerfile
    container_name: xtract-docling-markdown
    ports:
      - "7072:7072"
    environment:
      - FUNCTIONS_WORKER_RUNTIME=python
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      - azurite

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    container_name: xtract-realtime
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_SECRET=${JWT_SECRET:-xtract-local-dev-secret-change-me-32}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-xtract-local-config-encryption-key-change-me}
      - REALTIME_BROADCAST_SECRET=${REALTIME_BROADCAST_SECRET:-xtract-local-realtime-secret}
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}

  xtract-apps:
    build:
      context: .
      dockerfile: apps/xtract-apps/Dockerfile
    container_name: xtract-apps
    working_dir: /app
    volumes:
      - .:/app
      - xtract-apps-node-modules:/app/node_modules
      - xtract-apps-web-node-modules:/app/apps/web/node_modules
      - xtract-apps-processor-node-modules:/app/functions/processor/node_modules
    ports:
      - "5173:5173"
      - "7071:7071"
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - FUNCTIONS_WORKER_RUNTIME=node
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      - MONGODB_URI=mongodb://mongo:27017/xtract
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_MARKDOWN_SERVICE_URL=http://docling-markdown:7072/api/extract-markdown
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_EMBEDDING_MODEL=qwen3-embedding:4b
      - SIGNALR_ENABLED=${SIGNALR_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-xtract-local-dev-secret-change-me-32}
      - REALTIME_BROADCAST_URL=http://realtime:5080/internal/document-changed
      - REALTIME_HEALTH_URL=http://realtime:5080/health
      - PROCESSOR_HEALTH_URL=http://127.0.0.1:7071/admin/host/status
      - DOCLING_HEALTH_URL=http://docling-markdown:7072/admin/host/status
      - REALTIME_BROADCAST_SECRET=${REALTIME_BROADCAST_SECRET:-xtract-local-realtime-secret}
      - VITE_REALTIME_URL=${VITE_REALTIME_URL:-http://127.0.0.1:5080/hubs/documents}
    depends_on:
      - mongo
      - azurite
      - qdrant
      - docling-markdown
      - realtime

volumes:
  xtract-apps-node-modules:
  xtract-apps-web-node-modules:
  xtract-apps-processor-node-modules:
  mongo-data:
  azurite-data:
  qdrant-data:
